[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veristem"
version = "1.0.0"
description = "Autonomous, verifiable multi-agent STEM problem-solving and scientific reasoning platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "google-genai==1.5.0",
  "langgraph==0.2.69",
  "langgraph-checkpoint-sqlite==2.0.5",
  "langchain-core==0.3.31",
  "sympy==1.13.3",
  "numpy==2.2.2",
  "scipy==1.15.1",
  "pandas==2.2.3",
  "pint==0.24.4",
  "sqlalchemy==2.0.37",
  "aiosqlite==0.20.0",
  "psycopg[binary]==3.2.4",
  "opentelemetry-api==1.29.0",
  "opentelemetry-sdk==1.29.0",
  "structlog==25.1.0",
  "httpx==0.28.1",
  "streamlit==1.41.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "hypothesis==6.124.7",
  "ruff==0.9.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
